<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TroyApps</title>
  <meta name="description" content="TroyApps bagimsiz Android uygulamalari gelistiren bir gelistirici markasidir.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #111827;
      --panel-soft: #172033;
      --text: #f8fafc;
      --muted: #a7b0c0;
      --line: #263247;
      --accent: #36d399;
      --accent-strong: #5eead4;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 18%, rgba(54, 211, 153, 0.18), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(94, 234, 212, 0.14), transparent 30%),
        linear-gradient(135deg, #090d18 0%, var(--bg) 55%, #101827 100%);
      line-height: 1.6;
    }

    main {
      width: min(100%, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 48px 20px;
      display: grid;
      align-items: center;
    }

    .hero {
      display: grid;
      gap: 36px;
      grid-template-columns: minmax(0, 1.2fr) minmax(280px, 0.8fr);
      align-items: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 18px;
      color: var(--accent-strong);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 24px rgba(54, 211, 153, 0.75);
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .lead {
      max-width: 680px;
      margin: 24px 0 0;
      color: #d8dee9;
      font-size: clamp(1.05rem, 2.2vw, 1.35rem);
    }

    .sublead {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .info {
      display: grid;
      gap: 14px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 24, 39, 0.74);
      box-shadow: 0 24px 80px var(--shadow);
      backdrop-filter: blur(18px);
    }

    .info-row {
      display: grid;
      gap: 4px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .info-row:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .value {
      color: var(--text);
      font-size: 1.05rem;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    a {
      color: var(--accent-strong);
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      text-decoration: underline;
    }

    a:focus-visible {
      outline: 3px solid rgba(94, 234, 212, 0.45);
      outline-offset: 4px;
      border-radius: 4px;
    }

    @media (max-width: 760px) {
      main {
        padding: 32px 18px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .info {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Android uygulamalari</p>
        <h1 id="page-title">TroyApps</h1>
        <p class="lead">TroyApps ba&#287;&#305;ms&#305;z Android uygulamalar&#305; geli&#351;tiren bir geli&#351;tirici markas&#305;d&#305;r.</p>
        <p class="sublead">Kullan&#305;&#351;l&#305;, sade ve eri&#351;ilebilir mobil ara&#231;lar &#252;retmeye odaklan&#305;r.</p>
      </div>

      <div class="info" aria-label="TroyApps bilgileri">
        <div class="info-row">
          <span class="label">&#304;lk uygulama</span>
          <span class="value">Morse Flash</span>
        </div>
        <div class="info-row">
          <span class="label">Geli&#351;tirici</span>
          <span class="value">TroyApps</span>
        </div>
        <div class="info-row">
          <span class="label">&#304;leti&#351;im</span>
          <span class="value"><a href="mailto:troyapps.help@outlook.com">troyapps.help@outlook.com</a></span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
